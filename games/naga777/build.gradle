// Naga's Fortune 777 load test — gRPC-only (game không có REST spin endpoint).
//
// Module này KHÔNG dùng `io.gatling.gradle` plugin như silkroad/bonanza. Lý do: Gatling 3.15's
// first-party gRPC DSL là tính năng Enterprise, bản OSS chặn cứng ở 5 VU / 5 phút — vô dụng cho
// production gate 1000 VU. Thay bằng community plugin `com.github.phisgr:gatling-grpc`, nhưng bản
// cuối của nó (0.17.0) build cho Gatling 3.9.5 và `io.gatling.gradle` 3.9.5.x lại vỡ trên Gradle 9
// (`unknown property 'reportsDir'`). Nên module tự dựng classpath Gatling 3.9.5 riêng và gọi
// `io.gatling.app.Gatling` bằng JavaExec. Các game REST khác giữ nguyên Gatling 3.15.
//
// Run examples (from repo root) — cần backend NAGAS 777 chạy local (docker compose):
//   ./gradlew :games:naga777:grpc -Dusers=1 -DdurationMinutes=1 -DrampMinutes=0 \
//                                 -DrequestRate=0 -DeventCount=0
//   ./gradlew :games:naga777:grpc -Dusers=1000 -DdurationMinutes=60 \
//                                 -DgrpcHost=localhost -DgrpcPort=9096

plugins {
    id 'java'
    id 'scala'
}

def gatlingOssVersion = '3.9.5'
def gatlingGrpcVersion = '0.17.0'

configurations {
    gatlingRt
}

dependencies {
    gatlingRt "io.gatling.highcharts:gatling-charts-highcharts:${gatlingOssVersion}"
    gatlingRt "com.github.phisgr:gatling-grpc:${gatlingGrpcVersion}"
    gatlingRt 'org.scala-lang:scala-library:2.13.12'

    // Proto stub + MessagePack Codec tái dùng từ :core. Chặn Gatling 3.15 mà :core export
    // (`api gatling-charts-highcharts` / `gatling-grpc-java`) khỏi lọt vào classpath 3.9.5.
    gatlingRt(project(':core')) {
        exclude group: 'io.gatling'
        exclude group: 'io.gatling.highcharts'
    }
}

sourceSets {
    gatling {
        scala.srcDirs = ['src/gatling/scala']
        java.srcDirs = []
        resources.srcDirs = ['src/gatling/resources']
        compileClasspath = configurations.gatlingRt
        runtimeClasspath = output + configurations.gatlingRt
    }
}

// -D… system properties simulation đọc lúc runtime. Gradle không tự forward sang JVM fork,
// nên plumb thủ công.
def FORWARDED_PROPS = [
    'users', 'durationMinutes', 'rampMinutes', 'host', 'port', 'paceSec',
    'requestRate', 'eventCount', 'grpcHost', 'grpcPort', 'coinValue', 'coinPerLine',
]

def SIMULATIONS = [
    grpc: 'com.rgp.loadtest.naga777.grpc.Naga777GrpcSimulation',
]

SIMULATIONS.each { alias, fqcn ->
    tasks.register(alias, JavaExec) {
        group = 'gatling'
        description = "Run ${alias} simulation (${fqcn})"
        dependsOn tasks.named('gatlingClasses')
        classpath = sourceSets.gatling.runtimeClasspath
        mainClass = 'io.gatling.app.Gatling'
        args '-s', fqcn,
             '-rf', layout.buildDirectory.dir('reports/gatling').get().asFile.absolutePath
        jvmArgs = [
            '-server',
            '-Xmx2G',
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
        ]
        // Load tests always run — no input fingerprint can reliably detect "same SUT state"
        outputs.upToDateWhen { false }
        doFirst {
            // gameName lets SlaConfigLoader find this game's per-game SLA override at
            // games/<gameName>/src/gatling/resources/sla-thresholds.yml.
            systemProperty 'gameName', project.name
            FORWARDED_PROPS.each { name ->
                def v = System.getProperty(name)
                if (v != null) systemProperty(name, v)
            }
        }
    }
}
