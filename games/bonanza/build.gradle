// Golden Boat Bonanza load test — Gatling 3.15 OSS.
//
//   • REST sim  (Java)  — com.rgp.loadtest.bonanza.simulations.{Soak,Basic}Simulation
//   • gRPC sim  (Scala) — com.rgp.loadtest.bonanza.grpc.BonanzaGrpcSimulation
//
// gRPC uses Gatling's first-party Scala DSL (`io.gatling:gatling-grpc:3.15.0`) — same Gatling
// version as silkroad and :core. Java-gen proto stubs come from :core's `plugin_service.proto`
// (no ScalaPB; the Scala simulation reuses the Java classes directly).
//
// Run examples (from repo root) — host/port/contextPath load từ src/gatling/resources/game.yml:
//   ./gradlew :games:bonanza:soak  -Dusers=5 -DdurationMinutes=1 -DrampMinutes=1
//   ./gradlew :games:bonanza:basic -Dscenario=BetLevels -Dusers=1 -Drequests=1
//   ./gradlew :games:bonanza:grpc  -Dusers=5 -DdurationMinutes=1 -DrampMinutes=1 \
//                                 -DgrpcHost=localhost -DgrpcPort=9091

plugins {
    id 'java'
    id 'scala'
    id 'io.gatling.gradle' version "${gatlingGradleVersion}"
}

dependencies {
    gatlingImplementation project(':core')

    // Scala runtime so the Scala gRPC simulation can be compiled and loaded by the Gatling fork.
    gatlingImplementation "org.scala-lang:scala-library:2.13.12"

    // Gatling 3.15 native Scala gRPC DSL. The Java DSL (gatling-grpc-java) is already on the
    // classpath transitively via :core, but the Scala simulation needs the Scala surface.
    gatlingImplementation "io.gatling:gatling-grpc:${gatlingVersion}"
}

gatling {
    jvmArgs = [
        '-server',
        '-Xmx2G',
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
    ]
}

def FORWARDED_PROPS = [
    'users', 'requests', 'durationMinutes', 'rampMinutes', 'thinkTimeMin', 'thinkTimeMax',
    'host', 'port', 'contextPath', 'scenario', 'maxResponseTimeMs', 'paceSec',
    // Legacy BonanzaRestSimulation parity: global throughput + volume floors (REST + gRPC).
    'requestRate', 'eventCount',
    // gRPC simulation: WSProxy plugin endpoint host/port.
    'grpcHost', 'grpcPort',
]

def SIMULATIONS = [
    soak  : 'com.rgp.loadtest.bonanza.simulations.SoakSimulation',
    basic : 'com.rgp.loadtest.bonanza.simulations.BasicSimulation',
    grpc  : 'com.rgp.loadtest.bonanza.grpc.BonanzaGrpcSimulation',
]

SIMULATIONS.each { alias, fqcn ->
    tasks.register(alias, io.gatling.gradle.GatlingRunTask) {
        group = 'gatling'
        description = "Run ${alias} simulation (${fqcn})"
        simulationClassName = fqcn
        outputs.upToDateWhen { false }
        def fwd = ['gameName': project.name]
        FORWARDED_PROPS.each { name ->
            def v = System.getProperty(name)
            if (v != null) fwd[name] = v
        }
        systemProperties = fwd
    }
}
