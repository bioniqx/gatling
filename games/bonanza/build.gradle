// Golden Boat Bonanza load test — gRPC-only (the backend runs with
// spring.main.web-application-type=none and has no HTTP controllers).
//
// Same runtime as games/naga777: Gatling 3.9.5 + com.github.phisgr:gatling-grpc via JavaExec,
// because Gatling 3.15's OSS gRPC DSL is capped at 5 VU / 5 minutes and io.gatling.gradle 3.9.5
// breaks on Gradle 9 (`unknown property 'reportsDir'`).
//
// Java-gen proto stubs come from :core's `plugin_service.proto` (no ScalaPB; the Scala simulation
// reuses the Java classes directly).
//
// Run example (from repo root):
//   ./gradlew :games:bonanza:grpc -Dusers=5 -DdurationMinutes=1 -DrampMinutes=1 \
//                                 -DgrpcHost=localhost -DgrpcPort=9091

plugins {
    id 'java'
    id 'scala'
}

def gatlingOssVersion = '3.9.5'
def gatlingGrpcVersion = '0.17.0'

configurations {
    gatlingGrpcRt
}

dependencies {
    // --- gRPC simulation classpath ---
    gatlingGrpcRt "io.gatling.highcharts:gatling-charts-highcharts:${gatlingOssVersion}"
    gatlingGrpcRt "com.github.phisgr:gatling-grpc:${gatlingGrpcVersion}"
    gatlingGrpcRt 'org.scala-lang:scala-library:2.13.12'
    // Proto stub + MessagePack Codec from :core; block the Gatling 3.15 artifacts it exports.
    gatlingGrpcRt(project(':core')) {
        exclude group: 'io.gatling'
        exclude group: 'io.gatling.highcharts'
    }
}

sourceSets {
    gatlingGrpc {
        scala.srcDirs = ['src/gatlingGrpc/scala']
        java.srcDirs = []
        // Own resources first (logback), then the shared game.yml / sla-thresholds.yml that
        // SlaConfigLoader reads off the classpath.
        resources.srcDirs = ['src/gatlingGrpc/resources', 'src/gatling/resources']
        compileClasspath = configurations.gatlingGrpcRt
        runtimeClasspath = output + configurations.gatlingGrpcRt
    }
}

// -D flags the simulation reads at runtime; Gradle does not forward them to the JavaExec fork.
def FORWARDED_PROPS = [
    'users', 'durationMinutes', 'rampMinutes', 'paceSec',
    // Throughput + volume floors — ported verbatim from the legacy standalone repo.
    'requestRate', 'eventCount',
    // gRPC simulation: WSProxy plugin endpoint host/port.
    'grpcHost', 'grpcPort',
]

// gRPC simulation — Gatling 3.9.5, launched directly via JavaExec. Writes into the same reports
// dir so scripts/run-variant.sh picks the run up unchanged.
tasks.register('grpc', JavaExec) {
    group = 'gatling'
    description = 'Run grpc simulation (com.rgp.loadtest.bonanza.grpc.BonanzaGrpcSimulation)'
    dependsOn tasks.named('gatlingGrpcClasses')
    classpath = sourceSets.gatlingGrpc.runtimeClasspath
    mainClass = 'io.gatling.app.Gatling'
    args '-s', 'com.rgp.loadtest.bonanza.grpc.BonanzaGrpcSimulation',
         '-rf', layout.buildDirectory.dir('reports/gatling').get().asFile.absolutePath
    jvmArgs = [
        '-server',
        '-Xmx2G',
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
    ]
    outputs.upToDateWhen { false }
    doFirst {
        systemProperty 'gameName', project.name
        FORWARDED_PROPS.each { name ->
            def v = System.getProperty(name)
            if (v != null) systemProperty(name, v)
        }
    }
}
