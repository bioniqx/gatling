// Silk Road Caravans load test — extends core/ template.
//
// Run examples (from repo root):
//   ./gradlew :games:silkroad:soak    -Dusers=50 -DdurationMinutes=1 -DrampMinutes=1
//   ./gradlew :games:silkroad:stress  -DusersStart=10 -DusersEnd=20 -DdurationMinutes=1
//   ./gradlew :games:silkroad:spike   -Dbaseline=5 -Dspike=10 -Dcycles=2 -DcycleIntervalMinutes=1
//   ./gradlew :games:silkroad:basic   -Dscenario=spin -Dusers=1 -Drequests=1
//
// Or pick any simulation manually:
//   ./gradlew :games:silkroad:gatlingRun --simulation com.rgp.loadtest.silkroad.simulations.SoakSimulation

plugins {
    id 'io.gatling.gradle' version "${gatlingGradleVersion}"
}

dependencies {
    gatlingImplementation project(':core')
}

gatling {
    // --add-opens needed for Gatling 3.15 + JDK 17 (StringInternals reflection).
    jvmArgs = [
        '-server',
        '-Xmx2G',
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
    ]
}

// -D… system properties Gatling simulations read at runtime. They aren't forwarded automatically
// from the Gradle JVM to the gatlingRun fork, so we plumb them through explicitly.
def FORWARDED_PROPS = [
    'users', 'requests', 'durationMinutes', 'rampMinutes', 'thinkTimeMin', 'thinkTimeMax',
    'host', 'port', 'contextPath', 'parallel', 'scenario', 'maxResponseTimeMs',
    'usersStart', 'usersEnd', 'baseline', 'spike', 'spikeDurationSec',
    'cycles', 'cycleIntervalMinutes',
]

// Convenience aliases: `:soak`, `:stress`, `:spike`, `:basic` map to specific simulations.
def SIMULATIONS = [
    soak  : 'com.rgp.loadtest.silkroad.simulations.SoakSimulation',
    stress: 'com.rgp.loadtest.silkroad.simulations.StressSimulation',
    spike : 'com.rgp.loadtest.silkroad.simulations.SpikeSimulation',
    basic : 'com.rgp.loadtest.silkroad.simulations.BasicSimulation',
]

SIMULATIONS.each { alias, fqcn ->
    tasks.register(alias, io.gatling.gradle.GatlingRunTask) {
        group = 'gatling'
        description = "Run ${alias} simulation (${fqcn})"
        simulationClassName = fqcn
        // Load tests always run — no input fingerprint can reliably detect "same SUT state"
        outputs.upToDateWhen { false }
        // gameName lets SlaConfigLoader find this game's per-game SLA override at
        // games/<gameName>/src/gatling/resources/sla-thresholds.yml.
        def fwd = ['gameName': project.name]
        FORWARDED_PROPS.each { name ->
            def v = System.getProperty(name)
            if (v != null) fwd[name] = v
        }
        systemProperties = fwd
    }
}
