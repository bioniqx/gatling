# ============================================================================
# SLA Thresholds & Variant Ceilings — Edit Here, No Recompile Needed
# ============================================================================
#
# File này định nghĩa các tiêu chí pass/fail cho load test.
# Code Java tự đọc khi chạy — KHÔNG cần đụng vào file *.java.
#
# Loaded by:
#   - SlaConstants.java         (Gatling assertion — build fail nếu vượt PR-4 / PR-5)
#   - ThresholdVerifier.java    (post-run verdict.json + summary.html)
#
# Thứ tự ưu tiên khi load:
#   1. -DslaConfig=/abs/path/file.yml   (override qua command line)
#   2. config/sla-thresholds.yml        (file này — repo root)
#   3. classpath:sla-thresholds.yml     (bundled fallback)
#   4. Hardcoded defaults trong code    (cứu cuối khi file lỗi)
#
# Sửa số → save → chạy lại test. Không cần recompile.
# ============================================================================

# --- Application SLA (PR-4 / PR-5) — áp dụng cho mọi simulation -------------
sla:
  # PR-4: Mean response time trung bình ≤ N ms
  # Vượt → Gatling assertion fail → BUILD FAILED
  pr4_mean_response_ms_max: 500

  # PR-5: Error rate (HTTP KO) ≤ N %
  # Vượt → Gatling assertion fail → BUILD FAILED
  pr5_error_percent_max: 1.0

  # Wall-clock safety buffer (phút) cộng thêm vào maxDuration của Gatling
  # để VU không bị kill đúng giây cuối. Hiếm khi cần đổi.
  max_duration_buffer_min: 2

# --- Crash detection (PR-3) — chỉ áp dụng cho post-run verdict --------------
crash:
  # Số sample health probe FAIL liên tiếp coi như SUT down
  # Health probe chạy mỗi 2s → 3 fail = 6s downtime
  max_consecutive_failures: 3

# --- Variant ceiling (CPU% / Mem%) — áp dụng cho post-run verdict ----------
# Mỗi variant tương ứng 1 "mức kỳ vọng" về resource khi chạy production load.
# Ceiling = giá trị p95 tối đa cho phép. Vượt → verdict FAIL dù SLA pass.
variants:
  baseline:        # Headroom validation — server còn nhiều dư
    cpu_ceil: 50
    mem_ceil: 60

  target:          # ⭐ PRODUCTION GATE (default)
    cpu_ceil: 70
    mem_ceil: 80

  stress:          # Saturation — gần ngưỡng
    cpu_ceil: 85
    mem_ceil: 90

  critical:        # Pre-failure — chấp nhận gần đầy
    cpu_ceil: 95
    mem_ceil: 95
